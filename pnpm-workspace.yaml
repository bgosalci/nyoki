# pnpm 11 reads settings from here, not from the "pnpm" field in package.json.
#
# `allowBuilds` is the pnpm 11 key (pnpm 10 spelled it `onlyBuiltDependencies`,
# which pnpm 11 silently ignores). It is an explicit allowlist of the only
# packages permitted to run install scripts - pnpm exits 1 on any unapproved
# native build, which would otherwise fail `pnpm install` on Vercel.
#   @parcel/watcher - native file watcher used by `jest --watch`
#   unrs-resolver   - native resolver used by eslint-config-next
#   esbuild / workerd / msgpackr-extract - Prisma 7 toolchain
# Anything not listed here stays blocked from executing install scripts.
allowBuilds:
  '@parcel/watcher': true
  '@prisma/engines': true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  unrs-resolver: true
  workerd: true

# Patched versions of packages only other packages depend on, each within the
# major version its dependents ask for. `pnpm audit --prod` flagged them; the
# next upgrade of whatever pulls them in may make an entry unnecessary.
#   undici        - via @vercel/blob (TLS check bypass, DoS)
#   lodash        - via the prisma CLI's Studio (code injection, pollution)
#   mysql2        - via the prisma CLI (credential leak, inflate bomb)
#   zod, fast-uri, source-map-js - via @vercel/blob, prisma, the build
overrides:
  undici@6: ^6.29.1
  lodash@4: ^4.18.1
  mysql2@3: ^3.23.1
  zod@4: ^4.6.6
  fast-uri@3: ^3.1.9
  source-map-js@1: ^1.2.2
